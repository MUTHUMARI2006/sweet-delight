<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF8E7"/>
      <stop offset="100%" stop-color="#F2DEC2"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F6D365"/>
      <stop offset="100%" stop-color="#FDA085"/>
    </linearGradient>
    <filter id="softShadow">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#80132E" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#bgGlow)"/>
  
  <!-- Decorative pattern corners -->
  <circle cx="0" cy="0" r="100" fill="none" stroke="#D4AF37" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.4"/>
  <circle cx="600" cy="450" r="120" fill="none" stroke="#D4AF37" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.4"/>

  <!-- Golden Plate -->
  <ellipse cx="300" cy="270" rx="180" ry="70" fill="#E8D5B5" stroke="#C5A059" stroke-width="3" filter="url(#softShadow)"/>
  <ellipse cx="300" cy="265" rx="160" ry="60" fill="#FFFDF8" stroke="#D4AF37" stroke-width="1"/>
  
  <!-- Sweet Silhouette / Laddu Pyramid -->
  <circle cx="260" cy="230" r="38" fill="#D97706" stroke="#B45309" stroke-width="2"/>
  <circle cx="340" cy="230" r="38" fill="#C2410C" stroke="#9A3412" stroke-width="2"/>
  <circle cx="300" cy="180" r="42" fill="#F59E0B" stroke="#D97706" stroke-width="2"/>
  
  <!-- Saffron & Pistachio garnishes -->
  <ellipse cx="295" cy="165" rx="6" ry="2" fill="#15803D" transform="rotate(-30 295 165)"/>
  <ellipse cx="305" cy="170" rx="7" ry="2" fill="#DC2626" transform="rotate(45 305 170)"/>
  <ellipse cx="255" cy="215" rx="5" ry="2" fill="#15803D"/>
  <ellipse cx="345" cy="215" rx="5" ry="2" fill="#DC2626"/>

  <!-- Brand watermark -->
  <text x="300" y="380" font-family="'Playfair Display', serif" font-size="22" font-weight="700" fill="#6B0F24" text-anchor="middle" letter-spacing="1">Sweet Delight Mithai</text>
  <text x="300" y="405" font-family="sans-serif" font-size="12" fill="#B45309" text-anchor="middle" letter-spacing="2">HANDCRAFTED WITH PURE GHEE</text>
</svg>
